<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بداية — إعلان 50 ثانية (نسخة الإنتاج)</title>

    <!-- FONT IMPORTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #07090e; color: #ffffff;
            font-family: 'Readex Pro', 'Plus Jakarta Sans', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; min-height: 100dvh; overflow: hidden; padding: 10px;
        }
        #viewport {
            position: relative;
            max-height: 86vh;
            max-width: 94vw;
            width: auto;
            height: auto;
            background: #f5f5f4;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), 0 0 1px 1px rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
        #hud {
            position: absolute; top: 16px; right: 16px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(14px);
            color: #0a0f1d; padding: 6px 14px; border-radius: 30px;
            font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); border: 1px solid rgba(0, 0, 0, 0.06); z-index: 10;
        }
        .spinner {
            width: 12px; height: 12px; border: 2px solid #e5e5ea;
            border-top: 2px solid #0a0f1d; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #controls-overlay {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10; background: rgba(10, 15, 29, 0.92);
            padding: 6px 12px; border-radius: 40px; backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .btn {
            font-family: inherit; font-size: 12px; font-weight: 700; padding: 6px 14px;
            border-radius: 20px; border: none; cursor: pointer; display: flex;
            align-items: center; gap: 6px; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-preview { background: rgba(255, 255, 255, 0.12); color: #f8fafc; }
        .btn-preview:hover { background: rgba(255, 255, 255, 0.22); }
        .btn-render { background: #0a0f1d; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-render:hover { background: #1e293b; }
        #console-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 680px; max-width: 92vw; height: 400px; background: #090d16;
            border: 1px solid #1e293b; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.8);
            z-index: 100; display: none; flex-direction: column; overflow: hidden;
        }
        #console-header {
            background: #151d2d; padding: 12px 18px; display: flex;
            justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold;
        }
        #console-output {
            flex: 1; padding: 14px; overflow-y: auto; font-family: monospace;
            font-size: 12px; color: #cbd5e1; background: #060910; line-height: 1.6;
        }
        .log-line { margin-bottom: 4px; }
        .log-info { color: #38bdf8; }
        .log-warn { color: #facc15; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>
    <div id="viewport">
        <canvas id="videoCanvas"></canvas>
        <div id="hud"><div class="spinner" id="spinner"></div><span id="status-text">جاري إعداد المشهد...</span></div>
        <div id="controls-overlay">
            <button class="btn btn-preview" id="btn-replay"><i class="ph ph-arrow-counter-clockwise"></i> تشغيل المعاينة</button>
            <button class="btn btn-preview" id="btn-toggle-console"><i class="ph ph-terminal-window"></i> سجل الأخطاء</button>
            <button class="btn btn-render" id="btn-render-start"><i class="ph-fill ph-video-camera"></i> تصدير الفيديو</button>
        </div>
    </div>

    <div id="console-modal">
        <div id="console-header">
            <span><i class="ph ph-terminal-window"></i> سجل النظام والعمليات البرمجية</span>
            <button class="btn btn-preview" id="btn-close-console" style="color:#fff; background:#ef4444; border:none; padding:4px 14px;">إغلاق</button>
        </div>
        <div id="console-output"></div>
    </div>

    <script type="module">
        // =========================================================================
        // 1. CONFIG & IDENTITY CONTRACT
        // =========================================================================
        export const CONFIG = {
            fps: 30,
            width: 1080,
            height: 1920,
            duration: 50.0
        };
        export const OUTPUT_FILENAME = "bedaya_ad_50s";
        export let audioBuffer = null;

        const W = CONFIG.width;
        const H = CONFIG.height;

        // الهوية اللونية لمنصة بداية
        const INK = '#1c1917';
        const SEC = '#57534e';
        const MUT = '#8c857f';
        const BR  = '#e7e5e4';
        const SOFT = '#f0eeeb';
        const WS  = '#f5f5f4';

        const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
        const sc = (t, a, b) => cl((t - a) / (b - a));
        const eo = x => 1 - Math.pow(1 - x, 3);
        const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

        function tx(s, x, y, size, col, w = 600, al = 'center', fam = 'R') {
            ctx.font = `${w} ${size}px ${fam === 'J' ? '"Plus Jakarta Sans","Readex Pro"' : '"Readex Pro"'}, sans-serif`;
            ctx.fillStyle = col;
            ctx.textAlign = al;
            ctx.textBaseline = 'middle';
            ctx.fillText(s, x, y);
        }

        function ex(s, x, y, size, col, w = 400, al = 'left', dir = 'ltr', it = false) {
            ctx.direction = dir;
            ctx.font = `${it ? 'italic ' : ''}${w} ${size}px "Segoe UI", Calibri, "Readex Pro", Arial, sans-serif`;
            ctx.fillStyle = col;
            ctx.textAlign = al;
            ctx.textBaseline = 'middle';
            ctx.fillText(s, x, y);
            ctx.direction = 'rtl';
        }

        // شعار بداية المتجهي الدقيق
        const LP1 = new Path2D("m88.7 8.6c-4.5-4.1-9.7-6.6-17.1-7.5h-41.1c-6.5 0-12.5 1.6-17.3 5.5s-11.1 10.3-11.1 21.4v25.3c0 9.7 4.9 18.7 13.4 24.7l-3.1 12.3c-0.5 2.5 2.1 4.4 4.2 3.2l19.7-10.2h32.7c13.9 0 29-11.9 29-29.6v-25.5c-0.2-7.2-3.6-14.7-9.3-19.6zm4.1 44.2c0 13.1-9.8 24.9-24.4 24.9h-32.8c-0.5 0-0.9 0.2-1.3 0.4l-15.1 7.9 2.2-8.1c0.4-1.7-0.4-2.9-1.3-3.4-2.4-1.2-4.3-2.9-6.1-4.8-3.6-4.1-6-9.8-6.8-16.4v-24.7c0-11.7 10.4-22.1 21.4-22.1h42.5c10.6 0 21.7 9 21.7 22.3z");
        const LP2 = new Path2D("m67.7 51c-1.1 1.1-7.3 5.9-16.7 6.3s-15.9-4.4-17.8-6c-1.3-1.3-3-1.5-4.3-0.3-1.1 1.1-1.3 3.1 0.4 4.2 4.5 3.5 10.5 7.2 20.6 7.2 7.3 0 13.8-2.2 18.2-5.1 3.3-2.3 4-2.8 4-4.4 0-1.9-2.1-3.5-4.2-2.1z");
        
        function logo(cx, cy, size, col = INK) {
            ctx.save();
            ctx.translate(cx - size / 2, cy - size * 0.475);
            ctx.scale(size / 100, size / 100);
            ctx.fillStyle = col;
            ctx.strokeStyle = col;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.fill(LP1);
            ctx.lineWidth = 2.7;
            ctx.stroke(LP1);
            ctx.fill(LP2);
            ctx.lineWidth = 2;
            ctx.stroke(LP2);
            ctx.restore();
        }

        // =========================================================================
        // 2. ICONS ENGINE (Iconify via Memory Blobs)
        // =========================================================================
        const API = 'https://api.iconify.design/';
        const SRC = {
            wa: 'logos/whatsapp-icon', fb: 'logos/facebook', ig: 'skill-icons/instagram', tt: 'logos/tiktok-icon', tg: 'logos/telegram',
            chk: 'tabler/check?color=%23ffffff',
            truck: 'tabler/truck-delivery?color=%231d4ed8', cart: 'tabler/shopping-cart-check?color=%23143823',
            rot: 'tabler/rotate-2?color=%23c2410c', card: 'tabler/credit-card?color=%237e22ce',
            mplus: 'tabler/message-plus?color=%238c857f', mplusK: 'tabler/message-plus?color=%231c1917',
            pc: 'tabler/paperclip?color=%238c857f', fwd: 'tabler/arrow-forward?color=%23ffffff',
            copy: 'tabler/copy?color=%238c857f', rcw: 'tabler/rotate-clockwise?color=%238c857f',
            social: 'tabler/social?color=%231c1917', refresh: 'tabler/refresh?color=%231c1917', plug: 'tabler/plug?color=%238c857f',
            bolt2: 'tabler/bolt?color=%238c857f', msgbot: 'tabler/message-chatbot?color=%231c1917', msgs: 'tabler/messages?color=%231c1917',
            ushare: 'tabler/user-share?color=%231c1917', clist: 'tabler/clipboard-list?color=%231c1917',
            unlink: 'tabler/unlink?color=%23dc2626', okg: 'tabler/check?color=%23143823', link: 'tabler/link?color=%23ffffff',
            gm: 'logos/google-gmail', receipt: 'tabler/receipt-2?color=%231c1917', cck: 'tabler/circle-check?color=%231c1917',
            ckk: 'tabler/check?color=%231c1917',
            gem: 'logos/google-gemini', oai: 'logos/openai-icon', cla: 'logos/claude-icon', meta: 'logos/meta-icon'
        };
        const IMG = {};

        function loadIcon(k) {
            const u = API + SRC[k].replace(/^([^?]+)(\?(.*))?$/, (m, p, q, qq) => p + '.svg?height=256' + (qq ? '&' + qq : ''));
            return fetch(u).then(r => r.text()).then(s => new Promise(res => {
                const im = new Image();
                im.onload = () => { IMG[k] = im; res(); };
                im.onerror = res;
                im.src = URL.createObjectURL(new Blob([s], { type: 'image/svg+xml' }));
            })).catch(() => {});
        }

        function icon(k, cx, cy, size) {
            const im = IMG[k];
            if (!im) {
                ctx.beginPath();
                ctx.arc(cx, cy, size * 0.42, 0, Math.PI * 2);
                ctx.fillStyle = BR;
                ctx.fill();
                return;
            }
            const r = (im.naturalWidth || 1) / (im.naturalHeight || 1);
            const w = r >= 1 ? size : size * r;
            const h = r >= 1 ? size / r : size;
            ctx.drawImage(im, cx - w / 2, cy - h / 2, w, h);
        }

        function card(x, y, w, h, r = 32) {
            ctx.save();
            ctx.shadowColor = 'rgba(28,25,23,.09)';
            ctx.shadowBlur = 50;
            ctx.shadowOffsetY = 16;
            rr(x, y, w, h, r);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.restore();
            rr(x, y, w, h, r);
            ctx.strokeStyle = BR;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // =========================================================================
        // 3. FULL-SCREEN CHAT MODULE
        // =========================================================================
        const TYPED = [
            { text: 'السعر كام لو سمحت؟', a: 6.0, b: 6.7, send: 7.0 },
            { text: 'أيوه احجزلي', a: 9.2, b: 9.7, send: 10.0 },
            { text: 'أحمد سامي - 0109 481 2236', a: 11.8, b: 12.6, send: 12.9 }
        ];
        const MSGS = [
            { k: 'u', t: 7.0, text: 'السعر كام لو سمحت؟' },
            { k: 'a', ty: 7.35, t0: 7.85, text: 'أهلاً بيك! باقة النمو بـ 850 ج.م في الشهر.. تحب أحجزلك؟' },
            { k: 'u', t: 10.0, text: 'أيوه احجزلي' },
            { k: 'a', ty: 10.3, t0: 10.7, text: 'تمام! ابعتلي اسمك ورقم موبايلك' },
            { k: 'u', t: 12.9, text: 'أحمد سامي - 0109 481 2236' },
            { k: 'a', ty: 13.2, t0: 13.6, text: 'تم تسجيل طلبك بنجاح!\nوهتلاقي بياناتك في جدول العملاء دلوقتي.' }
        ];
        const STARTERS = [
            { ic: 'truck', bg: '#ebf3ff', t: 'مصاريف ومدة التوصيل', d: 'فحص تسعير المحافظات وسرعة تسليم الشحنات' },
            { ic: 'cart', bg: '#ebfcd2', t: 'تسجيل وحجز طلب جديد', d: 'اختبار التقاط بيانات العميل وتفريغها في الـ CRM' },
            { ic: 'rot', bg: '#ffeee6', t: 'سياسة الاستبدال والضمان', d: 'التأكد من التزام الوكيل بمدد وشروط المتجر' },
            { ic: 'card', bg: '#f7ebff', t: 'طرق الدفع والتحويل', d: 'فودافون كاش، InstaPay، والدفع عند الاستلام' }
        ];

        function wrap(text, maxW, font) {
            ctx.font = font;
            const outArr = [];
            text.split('\n').forEach(par => {
                let line = '';
                par.split(' ').forEach(w => {
                    const test = line ? line + ' ' + w : w;
                    if (line && ctx.measureText(test).width > maxW) {
                        outArr.push(line);
                        line = w;
                    } else line = test;
                });
                outArr.push(line);
            });
            return outArr;
        }

        function typingRow(t, y) {
            logo(1008, y + 45, 81);
            rr(789, y, 146, 68, 34);
            ctx.fillStyle = '#fafaf9';
            ctx.fill();
            ctx.strokeStyle = '#f0eeeb';
            ctx.lineWidth = 3;
            ctx.stroke();
            for (let i = 0; i < 3; i++) {
                const p = (((t / 1.1 - i * 0.136) % 1) + 1) % 1;
                const k = p < 0.3 ? p / 0.3 : p < 0.6 ? (0.6 - p) / 0.3 : 0;
                ctx.beginPath();
                ctx.arc(861 - i * 27, y + 34 - 11 * k, 7, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(140,133,127,${0.4 + 0.6 * k})`;
                ctx.fill();
            }
        }

        function chatScreen(t) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, W, H);

            // شاشة الترحيب
            const wa = 1 - sc(t, 7.0, 7.25);
            if (wa > 0) {
                ctx.save();
                ctx.globalAlpha *= wa;
                logo(540, 240, 130);
                tx('جرّب ردود وكيلك على العملاء', 540, 360, 56, INK, 800);
                wrap('تحدث معه كما سيتحدث عميلك الحقيقي، لاختبار فهمه للأسعار، سياسات الشحن، واستخراج بيانات الطلبات.', 900, '400 35px "Readex Pro"')
                    .forEach((l, i) => tx(l, 540, 440 + i * 58, 35, SEC, 400));
                STARTERS.forEach((s, i) => {
                    const y = 600 + i * 198;
                    rr(32, y, 1016, 172, 38);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                    ctx.strokeStyle = BR;
                    ctx.lineWidth = 2.7;
                    ctx.stroke();
                    rr(908, y + 36, 100, 100, 26);
                    ctx.fillStyle = s.bg;
                    ctx.fill();
                    icon(s.ic, 958, y + 86, 54);
                    tx(s.t, 878, y + 62, 36, INK, 700, 'right');
                    icon('mplus', 82, y + 62, 40);
                    tx(s.d, 878, y + 116, 30, MUT, 400, 'right');
                });
                ctx.restore();
            }

            // تتابع الرسائل
            let y = 120;
            MSGS.forEach(m => {
                if (m.k === 'u') {
                    if (t < m.t) return;
                    const p = eo(sc(t, m.t, m.t + 0.2));
                    ctx.font = '400 39px "Readex Pro"';
                    const bw = ctx.measureText(m.text).width + 98;
                    const bh = 128;
                    ctx.save();
                    ctx.globalAlpha *= p;
                    ctx.translate(0, (1 - p) * 16);
                    rr(32, y, bw, bh, [54, 54, 54, 11]);
                    ctx.fillStyle = '#f0eeeb';
                    ctx.fill();
                    tx(m.text, 32 + bw / 2, y + bh / 2 + 2, 39, INK, 400);
                    ctx.restore();
                    y += bh + 54;
                } else {
                    if (t < m.ty) return;
                    if (t < m.t0) {
                        typingRow(t, y);
                        y += 86 + 54;
                        return;
                    }
                    const words = m.text.split(' ');
                    const dur = 0.07 * words.length + 0.2;
                    const n = Math.ceil(words.length * sc(t, m.t0, m.t0 + dur));
                    const lines = wrap(words.slice(0, n).join(' '), 850, '400 40px "Readex Pro"');
                    const acts = t >= m.t0 + dur + 0.1;
                    const textH = lines.length * 72;
                    const p = eo(sc(t, m.t0, m.t0 + 0.2));
                    ctx.save();
                    ctx.globalAlpha *= p;
                    ctx.translate(0, (1 - p) * 16);
                    logo(1008, y + 45, 81);
                    lines.forEach((l, i) => tx(l, 935, y + 36 + i * 72, 40, INK, 400, 'right'));
                    if (acts) {
                        const ay = y + textH + 27 + 29;
                        const pa = eo(sc(t, m.t0 + dur + 0.1, m.t0 + dur + 0.4));
                        ctx.globalAlpha *= pa;
                        icon('copy', 900, ay, 38);
                        tx('نسخ', 870, ay + 1, 33, MUT, 400, 'right');
                        tx('• تم الرد في ~0.6s', 767, ay + 1, 29, MUT, 400, 'right');
                    }
                    ctx.restore();
                    y += Math.max(86, textH + (acts ? 85 : 0)) + 54;
                }
            });

            // الفوتر العائم
            const g = ctx.createLinearGradient(0, 1447, 0, H);
            g.addColorStop(0, 'rgba(255,255,255,0)');
            g.addColorStop(0.15, 'rgba(255,255,255,.7)');
            g.addColorStop(0.42, 'rgba(255,255,255,.98)');
            g.addColorStop(1, '#ffffff');
            ctx.fillStyle = g;
            ctx.fillRect(0, 1447, W, H - 1447);

            ctx.font = '700 33px "Readex Pro"';
            const nw = ctx.measureText('محادثة جديدة').width;
            const pw = nw + 38 + 16 + 70;
            const gw = pw + 22 + 76;
            const gx = 540 + gw / 2;

            rr(gx - pw, 1474, pw, 76, 38);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = BR;
            ctx.lineWidth = 2.7;
            ctx.stroke();
            icon('mplusK', gx - 35 - 19, 1512, 38);
            tx('محادثة جديدة', gx - 35 - 38 - 16, 1513, 33, INK, 700, 'right');

            ctx.beginPath();
            ctx.arc(gx - pw - 22 - 38, 1512, 38, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = BR;
            ctx.stroke();
            icon('rcw', gx - pw - 22 - 38, 1512, 40);

            ctx.save();
            ctx.shadowColor = 'rgba(28,25,23,.06)';
            ctx.shadowBlur = 70;
            ctx.shadowOffsetY = 16;
            rr(32, 1572, 1016, 244, 54);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.restore();
            rr(32, 1572, 1016, 244, 54);
            ctx.strokeStyle = BR;
            ctx.lineWidth = 2.7;
            ctx.stroke();

            let cur = null;
            TYPED.forEach(w => { if (t >= w.a - 0.3 && t < w.send) cur = w; });
            if (cur) {
                const shown = t < cur.a ? '' : cur.text.slice(0, Math.ceil(cur.text.length * sc(t, cur.a, cur.b)));
                tx(shown, 1010, 1637, 39, INK, 400, 'right');
                ctx.font = '400 39px "Readex Pro"';
                const cw = shown ? ctx.measureText(shown).width : 0;
                if (t < cur.b || Math.floor(t * 2.5) % 2 === 0) {
                    ctx.fillStyle = INK;
                    ctx.fillRect(1010 - cw - (shown ? 4 : 0), 1616, 3, 42);
                }
            } else {
                tx('اسأل الوكيل أي شيء لاختبار دقته...', 1010, 1637, 39, MUT, 300, 'right');
            }

            icon('pc', 967, 1748, 50);

            let press = 0;
            TYPED.forEach(w => { if (Math.abs(t - w.send) < 0.14) press = 1 - Math.abs(t - w.send) / 0.14; });
            ctx.save();
            ctx.translate(116, 1748);
            ctx.scale(1 - 0.1 * press, 1 - 0.1 * press);
            ctx.beginPath();
            ctx.arc(0, 0, 46, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(28,25,23,${1 - 0.12 * press})`;
            ctx.fill();
            icon('fwd', 0, 0, 48);
            ctx.restore();

            ctx.font = '600 31px "Readex Pro"';
            const mw = ctx.measureText('النماذج المدعومة:').width;
            const tw2 = mw + 19 + 4 * 41 + 3 * 19;
            const rx = 540 + tw2 / 2;
            tx('النماذج المدعومة:', rx, 1860, 31, MUT, 600, 'right');
            ['gem', 'oai', 'cla', 'meta'].forEach((k, i) => icon(k, rx - mw - 19 - 20 - i * 60, 1860, 41));
        }

        // =========================================================================
        // 4. FULL-SCREEN EXCEL CRM MODULE
        // =========================================================================

            tx(text, x - 27 - (ic ? 51 : 0), y + h / 2 + 2, 32, SEC, 600, 'right');
            return w;

                    ctx.fillStyle = INK;
                    ctx.fill();
                    tx('يرد ويسجّل.. وانت نايم', W / 2, 1719, 58, '#fff', 700);
                    ctx.restore();
                }
            }

            // E — خطط وباقات الأسعار (36.2s إلى 45.1s)
            const aP = sc(t, 36.2, 36.7) * (1 - sc(t, 44.6, 45.1));
            if (aP > 0) {
                ctx.globalAlpha = aP;
                pricingScreen(t);
                overlayPill(aP * eo(sc(t, 37.0, 37.5)) * (1 - sc(t, 39.0, 39.3)), 'باقات على قد شغلك');
                overlayPill(aP * eo(sc(t, 39.6, 40.1)) * (1 - sc(t, 43.0, 43.3)), 'وفّر 20% مع الدفع السنوي');
                overlayPill(aP * eo(sc(t, 43.6, 44.0)) * (1 - sc(t, 44.5, 44.8)), 'ابدأ من 450 ج.م في الشهر');
            }

            // F — شاشة الدعوة للعمل (CTA) والختام (44.9s إلى 50.0s)
            const tD = t - 17.9;
            const aD = sc(tD, 27.0, 27.4);
            if (aD > 0) {
                ctx.globalAlpha = aD;
                logo(W / 2, 520, 300);
                tx('جرّب مجانًا', W / 2, 860, 96, INK, 700);

                const pu = 1 + 0.025 * Math.sin(t * 8);
                ctx.save();
                ctx.translate(W / 2, 1070);
                ctx.scale(pu, pu);
                rr(-400, -75, 800, 150, 75);
                ctx.fillStyle = INK;
                ctx.fill();
                ctx.direction = 'ltr';
                tx('bedaya.web.app', 0, 4, 66, '#fff', 700, 'center', 'J');
                ctx.restore();
                ctx.direction = 'rtl';

                ['wa', 'ig', 'fb', 'tt', 'tg'].forEach((k, i) => {
                    const p = eo(sc(tD, 27.3 + i * 0.1, 27.8 + i * 0.1));
                    ctx.globalAlpha = aD * p;
                    const x = W / 2 + (i - 2) * 170;
                    const y = 1330;
                    card(x - 65, y - 65, 130, 130, 36);
                    icon(k, x, y, 70);
                });

                ctx.globalAlpha = aD * eo(sc(tD, 28.1, 28.7));
                tx('بدون بطاقة ائتمان  •  جاهز في ٥ دقائق', W / 2, 1530, 38, SEC, 400);
            }
        }

        // =========================================================================
        // 8. FIXED TECHNICAL RUNTIME LAYER (Ofoq Harness Engine)
        // =========================================================================
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const spinner = document.getElementById('spinner');

        let audioAudioEl = null;
        let sharedAudioCtx = null;
        let state = { currentTime: 0, isRendering: false, animationFrameId: null };

        window.renderStatus = 'loading';

        function logToConsole(msg, type = 'info') {
            const output = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = `log-line log-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        function getSharedAudioContext() {
            if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return sharedAudioCtx;
        }

        async function fetchAndDecodeAudio(url) {
            if (!/^https:\/\//i.test(url)) throw new Error(`رابط صوت غير آمن: ${url}`);
            const res = await fetch(url);
            if (!res.ok) throw new Error(`فشل جلب الصوت: ${url}`);
            const arrayBuf = await res.arrayBuffer();
            if (arrayBuf.byteLength < 1024) throw new Error(`حجم الملف صغير جداً: ${url}`);
            return getSharedAudioContext().decodeAudioData(arrayBuf);
        }

        function audioBufferToWavBlob(buffer) {
            const numOfChan = buffer.numberOfChannels;
            const length = buffer.length * numOfChan * 2 + 44;
            const out = new DataView(new ArrayBuffer(length));
            let channels = [], sample, offset = 0, pos = 0;

            function setUint16(data) { out.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { out.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164);
            setUint32(length - pos - 4);

            for (let i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

            while (offset < buffer.length) {
                for (let i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
                    out.setInt16(pos, sample, true);
                    pos += 2;
                }
                offset++;
            }
            return new Blob([out], { type: "audio/wav" });
        }

        function startPreviewLoop() {
            if (state.animationFrameId) cancelAnimationFrame(state.animationFrameId);
            if (audioAudioEl) {
                audioAudioEl.currentTime = 0;
                audioAudioEl.play().catch(e => logToConsole("تنبيه الصوت: " + e.message, 'warn'));
            }

            const startTime = performance.now();
            async function loop(now) {
                if (state.isRendering) return;
                const elapsed = (now - startTime) / 1000;
                const currTime = audioAudioEl ? audioAudioEl.currentTime : (elapsed % CONFIG.duration);
                state.currentTime = currTime;
                await drawSceneAtTime(currTime);

                if (currTime < CONFIG.duration) {
                    state.animationFrameId = requestAnimationFrame(loop);
                } else {
                    statusText.textContent = "جاهز للعرض والتصدير ✓";
                    spinner.style.display = 'none';
                }
            }
            state.animationFrameId = requestAnimationFrame(loop);
        }

        const OFOQ_FRAME_FORMAT = 'image/png';
        window.__ofoqTotalFrames = 0;
        window.__ofoqFps = 0;
        window.__ofoqOutputFilename = '';
        window.__ofoqAudioWavBase64 = null;

        async function __ofoqGetFrameBatch(startFrame, count) {
            state.isRendering = true;
            const frames = [];
            for (let i = 0; i < count; i++) {
                const frameIndex = startFrame + i;
                if (frameIndex >= window.__ofoqTotalFrames) break;
                const timestamp = frameIndex / window.__ofoqFps;
                await drawSceneAtTime(timestamp);
                const dataUrl = canvas.toDataURL(OFOQ_FRAME_FORMAT);
                frames.push(dataUrl.substring(dataUrl.indexOf(',') + 1));
            }
            return frames;
        }
        window.__ofoqGetFrameBatch = __ofoqGetFrameBatch;

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        document.getElementById('btn-replay').addEventListener('click', () => {
            statusText.textContent = "جاري عرض المعاينة...";
            spinner.style.display = 'inline-block';
            startPreviewLoop();
        });

        document.getElementById('btn-toggle-console').addEventListener('click', () => {
            const modal = document.getElementById('console-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        });

        document.getElementById('btn-close-console').addEventListener('click', () => {
            document.getElementById('console-modal').style.display = 'none';
        });

        document.getElementById('btn-render-start').addEventListener('click', () => {
            logToConsole("التصدير الفعلي يتم عبر render-runner.js (Node + ffmpeg).", 'warn');
        });

        async function init() {
            try {
                await prepareIdentity();
                canvas.width = CONFIG.width;
                canvas.height = CONFIG.height;

                const viewport = document.getElementById('viewport');
                viewport.style.aspectRatio = `${CONFIG.width} / ${CONFIG.height}`;
                viewport.style.width = `min(94vw, calc(86vh * (${CONFIG.width} / ${CONFIG.height})))`;

                window.__ofoqFps = CONFIG.fps;
                window.__ofoqTotalFrames = Math.ceil(CONFIG.duration * CONFIG.fps);
                window.__ofoqOutputFilename = `${OUTPUT_FILENAME}.mp4`;

                if (audioBuffer) {
                    const wavBlob = audioBufferToWavBlob(audioBuffer);
                    audioAudioEl = new Audio(URL.createObjectURL(wavBlob));
                    window.__ofoqAudioWavBase64 = arrayBufferToBase64(await wavBlob.arrayBuffer());
                }

                statusText.textContent = "جاهز للعرض والتصدير ✓";
                spinner.style.display = 'none';
                window.renderStatus = 'ready';
                await drawSceneAtTime(0);
            } catch (err) {
                logToConsole("خطأ أثناء التهيئة: " + err.message, 'error');
                statusText.textContent = "حدث خطأ أثناء التحميل";
                window.__renderError = err.message;
                window.renderStatus = 'error';
            }
        }
        window.addEventListener('load', init);
    </script>
